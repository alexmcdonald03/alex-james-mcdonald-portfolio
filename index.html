<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4ec0f0">
<title>Flappy Bird</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #2a4d63;
    overflow: hidden;
    position: fixed; inset: 0;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block;
    touch-action: none;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    outline: none;
  }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Flappy Bird game. Press space or tap to flap."></canvas>
<script>
'use strict';
/* ============================================================
   FLAPPY BIRD — self-contained, no dependencies
   Logical resolution: 288 wide x (512..620) tall, scaled to fit.
   Physics run on a fixed 120 Hz timestep (frame-rate independent).
   ============================================================ */

const W = 288;
const GROUND_H = 80;
const STEP = 1 / 120;

// ---- Tuning ----
const GRAVITY = 1150;          // px/s^2
const FLAP_V = -345;           // px/s
const MAX_FALL = 620;          // terminal velocity
const BASE_SPEED = 118;        // px/s pipe scroll
const PIPE_W = 52;
const CAP_H = 24;
const BIRD_X = 88;
const HIT_W = 24, HIT_H = 17;  // forgiving hitbox (sprite is 34x22)

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let H = 512, groundY = H - GROUND_H, scale = 1, dpr = 1;

/* ---------------- Storage ---------------- */
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

let best = parseInt(lsGet('flappy_best', '0'), 10) || 0;
let muted = lsGet('flappy_muted', '0') === '1';

/* ---------------- Audio ---------------- */
let actx = null;
function ensureAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
    if (actx) { // iOS unlock
      try { const b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0); } catch (e) {}
    }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f0, f1, dur, type, vol, delay) {
  if (muted || !actx) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol) {
  if (muted || !actx) return;
  const n = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = actx.createBufferSource(), g = actx.createGain();
  s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(actx.destination); s.start();
}
const sfx = {
  flap()  { tone(380, 640, 0.09, 'triangle', 0.18); },
  score() { tone(880, 880, 0.07, 'square', 0.07); tone(1318, 1318, 0.12, 'square', 0.07, 0.07); },
  hit()   { noise(0.18, 0.35); tone(220, 60, 0.15, 'sawtooth', 0.15); },
  die()   { tone(500, 110, 0.45, 'square', 0.07, 0.12); },
  swoosh(){ tone(900, 300, 0.12, 'sine', 0.06); }
};

/* ---------------- Sprites (generated pixel art) ---------------- */
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const BIRD_ROWS = [
  "....KKKKKKK......",
  "..KKLLYYYYKWWWK..",
  ".KLLYYYYYYKWWEWK.",
  "KLYYYYYYYYKWWWWK.",
  "KYYYYYYYYYKRRRRRK",
  "KYYYYYYYYYKOOOOOK",
  "KYYYYYYYYYYKKKKK.",
  ".KYYYYYYYYYYYYK..",
  ".KKYYYYYYYYYYK...",
  "..KKOOYYYYYYK....",
  "....KKKKKKKK....."
];
const BIRD_PAL = { K: '#3b2a2a', Y: '#f8d030', L: '#fff2a0', O: '#f08a1c', W: '#ffffff', R: '#e8452c', E: '#222222' };

function buildBird(frameOffset) {
  const c = mk(17, 11), g = c.getContext('2d');
  BIRD_ROWS.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch !== '.') { g.fillStyle = BIRD_PAL[ch]; g.fillRect(x, y, 1, 1); }
    }
  });
  // wing
  const wx = 2, wy = 5 + frameOffset;
  g.fillStyle = BIRD_PAL.K; g.fillRect(wx, wy, 6, 4);
  g.fillStyle = '#fff6c8'; g.fillRect(wx + 1, wy + 1, 4, 2);
  g.fillStyle = '#f0b030'; g.fillRect(wx + 1, wy + 2, 4, 1);
  g.clearRect(wx, wy + 3, 1, 1); g.clearRect(wx + 5, wy + 3, 1, 1);
  g.fillStyle = BIRD_PAL.K; g.fillRect(wx + 1, wy + 3, 4, 1);
  return c;
}
const birdFrames = [buildBird(-2), buildBird(0), buildBird(2)];
const WING_SEQ = [0, 1, 2, 1];

function buildPipeSprites() {
  const colors = i => {
    if (i === 0 || i === 25) return '#2f3a1a';
    if (i === 1) return '#d6f58a';
    if (i <= 3) return '#b4ec5a';
    if (i <= 6) return '#8fd43c';
    if (i <= 15) return '#73bf2e';
    if (i <= 19) return '#5e9f22';
    return '#4a8018';
  };
  const body = mk(26, 1), bg = body.getContext('2d');
  for (let i = 0; i < 26; i++) { bg.fillStyle = colors(i); bg.fillRect(i, 0, 1, 1); }
  const cap = mk(28, 12), cg = cap.getContext('2d');
  for (let x = 0; x < 28; x++) {
    for (let y = 0; y < 12; y++) {
      let col;
      if (y === 0 || y === 11 || x === 0 || x === 27) col = '#2f3a1a';
      else col = colors(Math.min(25, Math.max(0, x - 1)));
      if (y === 10 && col !== '#2f3a1a') col = '#3f6a14';
      cg.fillStyle = col; cg.fillRect(x, y, 1, 1);
    }
  }
  return { body, cap };
}
const pipeSprites = buildPipeSprites();

function buildGroundTile() {
  const w = 16, h = GROUND_H / 2;
  const c = mk(w, h), g = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let col;
      if (y === 0) col = '#3b2a2a';
      else if (y <= 5) col = ((x + y) % 16 < 8) ? '#73bf2e' : '#9ce659';
      else if (y === 6) col = '#4a8018';
      else if (y === 7) col = '#e6c75a';
      else col = '#ded895';
      if (y > 7 && ((x + y * 3) % 23 === 0)) col = '#cdbd7a';
      g.fillStyle = col; g.fillRect(x, y, 1, 1);
    }
  }
  return c;
}
const groundTile = buildGroundTile();

function buildCloud(seed, w, h) {
  const c = mk(w, h), g = c.getContext('2d');
  let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const circles = [];
  const n = 4 + Math.floor(rnd() * 2);
  for (let i = 0; i < n; i++) {
    const r = h * (0.28 + rnd() * 0.2);
    circles.push([(i + 0.7) * (w - 2 * r) / n + r * 0.6, h - r - 1 - rnd() * h * 0.2, r]);
  }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let inside = false;
    for (const [cx, cy, r] of circles) if ((x - cx) ** 2 + (y - cy) ** 2 <= r * r) { inside = true; break; }
    if (y >= h - 1) inside = inside && x > 2 && x < w - 3;
    if (inside) { g.fillStyle = y > h * 0.72 ? '#d8eefa' : '#ffffff'; g.fillRect(x, y, 1, 1); }
  }
  return c;
}
const clouds = [buildCloud(7, 40, 16), buildCloud(13, 30, 12), buildCloud(29, 48, 18)];

function buildCity() {
  const w = 144, h = 60;
  const c = mk(w, h), g = c.getContext('2d');
  let s = 42;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  // far silhouettes
  let x = 0;
  while (x < w) {
    const bw = 10 + Math.floor(rnd() * 14), bh = 18 + Math.floor(rnd() * 26);
    const bx = x, by = h - 8 - bh;
    const ww = Math.min(bw, w - bx);
    g.fillStyle = '#b6dcea'; g.fillRect(bx, by, ww, bh + 8);
    g.fillStyle = '#c9e8f2'; g.fillRect(bx, by, ww, 1);
    g.fillStyle = '#9bcade';
    for (let wy = by + 3; wy < h - 12; wy += 4)
      for (let wx = bx + 2; wx < bx + ww - 2; wx += 4) g.fillRect(wx, wy, 2, 2);
    if (rnd() > 0.65 && ww > 8) { g.fillStyle = '#b6dcea'; g.fillRect(bx + (ww >> 1), by - 5, 1, 5); }
    x += bw + (rnd() > 0.7 ? 2 : 0);
  }
  // bushes
  for (let bx = 0; bx < w; bx += 1) {
    const hh = 3 + Math.round(2 * Math.abs(Math.sin(bx * 0.45)) + 1.2 * Math.sin(bx * 0.17 + 1));
    g.fillStyle = '#5fb02e'; g.fillRect(bx, h - hh - 2, 1, hh + 2);
    g.fillStyle = '#7fd143'; g.fillRect(bx, h - hh - 2, 1, 1);
  }
  g.fillStyle = '#5fb02e'; g.fillRect(0, h - 2, w, 2);
  return c;
}
const cityTile = buildCity();
const CITY_H = 120; // logical px

/* ---------------- Game state ---------------- */
const game = {
  state: 'ready',  // ready | play | dying | over
  t: 0,
  score: 0,
  newBest: false,
  speed: BASE_SPEED,
  pipes: [],
  nextSpawn: 0,
  lastCenter: null,
  groundOff: 0, cityOff: 0,
  clouds: [],
  flash: 0, shake: 0, popT: 1,
  overT: 0,        // seconds since game over screen
  shown: 0,        // displayed score for count-up
  bird: { y: 0, vy: 0, angle: 0, wingT: 0 }
};

function hoverY() { return Math.round(groundY * 0.46); }

function initClouds() {
  game.clouds = [];
  for (let i = 0; i < 6; i++) {
    game.clouds.push({
      x: Math.random() * (W + 100) - 50,
      y: 30 + Math.random() * (groundY * 0.5),
      k: Math.floor(Math.random() * clouds.length),
      v: 8 + Math.random() * 10,
      s: 2
    });
  }
}

function reset() {
  const g = game;
  layout(true);
  g.state = 'ready';
  g.score = 0; g.newBest = false; g.shown = 0;
  g.speed = BASE_SPEED;
  g.pipes = []; g.nextSpawn = W + 50; g.lastCenter = null;
  g.flash = 0; g.shake = 0; g.popT = 1; g.overT = 0;
  g.bird.y = hoverY(); g.bird.vy = 0; g.bird.angle = 0;
}

function gapSize() { return 112 - Math.min(game.score, 25) * 0.8; }          // 112 -> 92
function speedFor(score) { return BASE_SPEED + Math.min(score, 30) * 1.3; }  // 118 -> 157

function spawnPipe(x) {
  const gap = gapSize();
  const margin = 58;
  const lo = margin + gap / 2, hi = groundY - margin - gap / 2;
  let a = lo, b = hi;
  if (game.lastCenter !== null) { a = Math.max(lo, game.lastCenter - 105); b = Math.min(hi, game.lastCenter + 105); }
  const center = a + Math.random() * (b - a);
  game.lastCenter = center;
  game.pipes.push({ x, gap, top: center - gap / 2, scored: false });
}

function flap() {
  const g = game;
  if (g.state === 'ready') { g.state = 'play'; }
  if (g.state !== 'play') return;
  g.bird.vy = FLAP_V;
  g.bird.angle = -0.45;
  sfx.flap();
}

function die(hitPipe) {
  const g = game;
  if (g.state !== 'play') return;
  g.state = 'dying';
  g.flash = 1; g.shake = 0.25;
  sfx.hit();
  if (hitPipe) sfx.die();
  if (g.score > best) { best = g.score; g.newBest = true; lsSet('flappy_best', String(best)); }
}

function finish() {
  const g = game;
  g.state = 'over'; g.overT = 0; g.shown = 0;
  sfx.swoosh();
}

function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function update(dt) {
  const g = game, b = g.bird;
  g.t += dt;
  if (g.flash > 0) g.flash = Math.max(0, g.flash - dt * 4);
  if (g.shake > 0) g.shake = Math.max(0, g.shake - dt);
  if (g.popT < 1) g.popT = Math.min(1, g.popT + dt * 5);

  // parallax (stops once dead)
  if (g.state !== 'dying' && g.state !== 'over') {
    g.groundOff = (g.groundOff + g.speed * dt) % 32;
    g.cityOff = (g.cityOff + g.speed * 0.18 * dt) % 288;
  }
  for (const c of g.clouds) {
    if (g.state === 'dying' || g.state === 'over') break;
    c.x -= c.v * dt;
    if (c.x < -120) { c.x = W + 20 + Math.random() * 40; c.y = 30 + Math.random() * (groundY * 0.5); }
  }

  if (g.state === 'ready') {
    b.wingT += dt * 9;
    b.y = hoverY() + Math.sin(g.t * 5) * 5;
    b.angle = 0;
    return;
  }

  if (g.state === 'play') {
    b.wingT += dt * 14;
    b.vy = Math.min(MAX_FALL, b.vy + GRAVITY * dt);
    b.y += b.vy * dt;
    if (b.y < -8) { b.y = -8; if (b.vy < 0) b.vy = 0; }

    g.speed = speedFor(g.score);

    // pipes
    for (const p of g.pipes) p.x -= g.speed * dt;
    g.nextSpawn -= g.speed * dt;
    if (g.nextSpawn <= 0) {
      spawnPipe(W + 10);
      g.nextSpawn = PIPE_W + g.speed * 1.38;     // ~constant time between pipes
    }
    while (g.pipes.length && g.pipes[0].x < -PIPE_W - 10) g.pipes.shift();

    // score + collisions
    const bx = BIRD_X - HIT_W / 2, by = b.y - HIT_H / 2;
    for (const p of g.pipes) {
      if (!p.scored && p.x + PIPE_W < BIRD_X - 4) {
        p.scored = true; g.score++; g.popT = 0; sfx.score();
      }
      if (rectHit(bx, by, HIT_W, HIT_H, p.x, -50, PIPE_W, p.top + 50) ||
          rectHit(bx, by, HIT_W, HIT_H, p.x, p.top + p.gap, PIPE_W, groundY - (p.top + p.gap) + 50)) {
        die(true); break;
      }
    }
    if (g.state === 'play' && b.y + HIT_H / 2 >= groundY) {
      b.y = groundY - HIT_H / 2; die(false); finish();
    }
    // angle
    const t = Math.min(1, Math.max(0, (b.vy + 200) / 700));
    const target = -0.45 + t * 1.9;
    b.angle += (target - b.angle) * Math.min(1, dt * 14);
    return;
  }

  if (g.state === 'dying') {
    b.vy = Math.min(MAX_FALL + 100, b.vy + GRAVITY * dt);
    b.y += b.vy * dt;
    b.angle = Math.min(1.5, b.angle + dt * 9);
    if (b.y + HIT_H / 2 >= groundY) {
      b.y = groundY - HIT_H / 2; b.angle = 1.5; finish();
    }
    return;
  }

  if (g.state === 'over') {
    g.overT += dt;
    // count up displayed score
    if (g.shown < g.score && g.overT > 0.45) {
      g.shown = Math.min(g.score, g.shown + Math.max(1, g.score) * dt / 0.6);
    }
  }
}

/* ---------------- Rendering ---------------- */
function text(str, x, y, size, opt) {
  opt = opt || {};
  ctx.font = '900 ' + size + 'px "Arial Black","Helvetica Neue",Impact,Arial,sans-serif';
  ctx.textAlign = opt.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  const lw = opt.lw !== undefined ? opt.lw : Math.max(3, size / 6);
  if (lw > 0) { ctx.lineWidth = lw; ctx.strokeStyle = opt.stroke || '#3b2a2a'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = opt.fill || '#fff';
  ctx.fillText(str, x, y);
}

function drawPipe(p) {
  const x = Math.round(p.x);
  const topEnd = Math.round(p.top);
  const botStart = Math.round(p.top + p.gap);
  // top pipe
  ctx.drawImage(pipeSprites.body, 0, 0, 26, 1, x, topEnd - CAP_H - 600, PIPE_W, 600);
  ctx.drawImage(pipeSprites.cap, x - 2, topEnd - CAP_H, PIPE_W + 4, CAP_H);
  // bottom pipe
  ctx.drawImage(pipeSprites.body, 0, 0, 26, 1, x, botStart + CAP_H, PIPE_W, groundY - botStart);
  ctx.drawImage(pipeSprites.cap, x - 2, botStart, PIPE_W + 4, CAP_H);
}

function drawMute() {
  const cx = W - 24, cy = 24;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 8, cy - 3); ctx.lineTo(cx - 4, cy - 3); ctx.lineTo(cx + 1, cy - 8);
  ctx.lineTo(cx + 1, cy + 8); ctx.lineTo(cx - 4, cy + 3); ctx.lineTo(cx - 8, cy + 3); ctx.closePath(); ctx.fill();
  if (muted) {
    ctx.strokeStyle = '#ff6b5a';
    ctx.beginPath(); ctx.moveTo(cx + 4, cy - 4); ctx.lineTo(cx + 10, cy + 4);
    ctx.moveTo(cx + 10, cy - 4); ctx.lineTo(cx + 4, cy + 4); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(cx + 2, cy, 5, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 2, cy, 9, -0.9, 0.9); ctx.stroke();
  }
  ctx.restore();
}

function medalFor(score) {
  if (score >= 40) return { name: 'platinum', a: '#e6fbff', b: '#7fd8e8', c: '#3d93a8' };
  if (score >= 30) return { name: 'gold', a: '#fff0a0', b: '#f5c518', c: '#b78a0a' };
  if (score >= 20) return { name: 'silver', a: '#f4f7fa', b: '#bcc6d0', c: '#7d8791' };
  if (score >= 10) return { name: 'bronze', a: '#ffd2a0', b: '#cd7f32', c: '#7d4a1a' };
  return null;
}

function drawMedal(cx, cy, m, t) {
  ctx.save();
  if (!m) {
    ctx.fillStyle = '#c9b872'; ctx.strokeStyle = '#a89858'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 21, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore(); return;
  }
  ctx.fillStyle = m.c;
  ctx.beginPath(); ctx.arc(cx, cy, 23, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = m.b;
  ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = m.a; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.stroke();
  // star
  ctx.fillStyle = m.a;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 4.5 : 10, a = -Math.PI / 2 + i * Math.PI / 5;
    ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill();
  // shine sweep
  const sh = ((t * 0.8) % 2) - 0.5;
  if (sh > 0 && sh < 1) {
    ctx.globalAlpha = 0.6; ctx.fillStyle = '#fff';
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI * 2); ctx.clip();
    ctx.translate(cx - 24 + sh * 48, cy); ctx.rotate(0.6); ctx.fillRect(-2, -30, 4, 60);
    ctx.restore();
  }
  ctx.restore();
}

const UI = {};   // button rects, set during render
function overLayout() {
  const pw = 240, ph = 124;
  const px = (W - pw) / 2;
  const py = Math.round(H * 0.31);
  const bw = 130, bh = 46;
  return { pw, ph, px, py, btn: { x: (W - bw) / 2, y: py + ph + 22, w: bw, h: bh } };
}
function easeOutBack(x) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
function clamp01(x) { return Math.max(0, Math.min(1, x)); }

function drawGameOver() {
  const g = game, L = overLayout();
  const t = g.overT;
  // title
  const ta = clamp01(t / 0.25);
  ctx.save();
  ctx.globalAlpha = ta;
  const ty = Math.round(H * 0.2) - (1 - ta) * 16;
  text('GAME OVER', W / 2, ty, 38, { fill: '#ff8a3c', lw: 6 });
  ctx.restore();

  // panel slides up
  const pt = clamp01((t - 0.2) / 0.45);
  const off = (1 - easeOutBack(pt)) * 260;
  ctx.save();
  ctx.translate(0, off);
  ctx.globalAlpha = clamp01(pt * 3);
  const { px, py, pw, ph } = L;
  ctx.fillStyle = '#3b2a2a'; roundRect(px - 3, py - 3, pw + 6, ph + 6, 10); ctx.fill();
  ctx.fillStyle = '#ded895'; roundRect(px, py, pw, ph, 8); ctx.fill();
  ctx.fillStyle = '#e9e4a6'; roundRect(px + 4, py + 4, pw - 8, 18, 5); ctx.fill();
  ctx.fillStyle = '#d4a540'; ctx.fillRect(px + 4, py + ph - 8, pw - 8, 4);
  text('MEDAL', px + 52, py + 22, 13, { fill: '#e8742c', stroke: '#e8742c', lw: 0 });
  text('SCORE', px + pw - 18, py + 22, 13, { fill: '#e8742c', stroke: '#e8742c', lw: 0, align: 'right' });
  drawMedal(px + 52, py + 70, medalFor(g.score), g.overT);
  text(String(Math.floor(g.shown)), px + pw - 18, py + 46, 26, { align: 'right', lw: 4 });
  text('BEST', px + pw - 18, py + 76, 13, { fill: '#e8742c', stroke: '#e8742c', lw: 0, align: 'right' });
  text(String(best), px + pw - 18, py + 99, 26, { align: 'right', lw: 4 });
  if (g.newBest && g.shown >= g.score) {
    ctx.save();
    ctx.translate(px + pw - 100, py + 90); ctx.rotate(-0.15);
    ctx.fillStyle = '#e8452c'; roundRect(-20, -9, 40, 18, 4); ctx.fill();
    text('NEW', 0, 1, 12, { lw: 0 });
    ctx.restore();
  }
  ctx.restore();

  // button
  const bt = clamp01((t - 0.55) / 0.3);
  ctx.save();
  ctx.globalAlpha = bt;
  const b = L.btn, press = UI.btnDown ? 3 : 0;
  ctx.translate(0, (1 - bt) * 20 + press);
  ctx.fillStyle = '#3b2a2a'; roundRect(b.x - 3, b.y - 3, b.w + 6, b.h + 6, 10); ctx.fill();
  ctx.fillStyle = '#c4501a'; roundRect(b.x, b.y + 3, b.w, b.h - 3, 8); ctx.fill();
  ctx.fillStyle = UI.btnDown ? '#ff9a4a' : '#ff8a3c'; roundRect(b.x, b.y, b.w, b.h - 5 - press, 8); ctx.fill();
  text('PLAY AGAIN', b.x + b.w / 2, b.y + b.h / 2 - 3, 17, { lw: 4 });
  ctx.restore();
  UI.btnActive = bt > 0.6;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function render() {
  const g = game, b = g.bird;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;

  ctx.save();
  if (g.shake > 0) {
    const m = g.shake * 24;
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }

  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, groundY);
  sky.addColorStop(0, '#2fa4e8'); sky.addColorStop(1, '#8ddcf7');
  ctx.fillStyle = sky; ctx.fillRect(-10, -10, W + 20, H + 20);

  // clouds
  for (const c of g.clouds) {
    const sp = clouds[c.k];
    ctx.drawImage(sp, Math.round(c.x), Math.round(c.y), sp.width * c.s, sp.height * c.s);
  }

  // city
  const cx = -Math.round(g.cityOff);
  for (let x = cx; x < W; x += 288) ctx.drawImage(cityTile, x, groundY - CITY_H, 288, CITY_H);

  // pipes
  for (const p of g.pipes) drawPipe(p);

  // ground
  const go = -Math.round(g.groundOff);
  for (let x = go; x < W; x += 32) ctx.drawImage(groundTile, x, groundY, 32, GROUND_H);
  ctx.fillStyle = '#ded895'; ctx.fillRect(0, groundY + GROUND_H, W, H - groundY - GROUND_H + 10);

  // bird
  ctx.save();
  ctx.translate(BIRD_X, Math.round(b.y));
  ctx.rotate(b.angle);
  let frame = WING_SEQ[Math.floor(b.wingT) % 4];
  if (g.state === 'dying' || g.state === 'over') frame = 1;
  else if (g.state === 'play' && b.angle > 1.15) frame = 1;
  ctx.drawImage(birdFrames[frame], -17, -11, 34, 22);
  ctx.restore();

  // HUD
  if (g.state === 'play' || g.state === 'dying') {
    const k = 1 + 0.3 * Math.sin(g.popT * Math.PI);
    ctx.save();
    ctx.translate(W / 2, 62); ctx.scale(k, k);
    text(String(g.score), 0, 0, 46, { lw: 7 });
    ctx.restore();
  }

  if (g.state === 'ready') {
    text('FLAPPY', W / 2, Math.round(H * 0.17), 46, { fill: '#ffb534', lw: 8 });
    text('BIRD', W / 2, Math.round(H * 0.17) + 48, 46, { fill: '#ffb534', lw: 8 });
    // tap hint
    const blink = (Math.sin(g.t * 5) + 1) / 2;
    ctx.save(); ctx.globalAlpha = 0.55 + 0.45 * blink;
    text('TAP TO START', W / 2, Math.round(groundY * 0.72), 22, { lw: 5 });
    ctx.restore();
    // little tap icon
    const ty = Math.round(groundY * 0.72) + 36 + Math.sin(g.t * 6) * 3;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#3b2a2a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(W / 2, ty, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(W / 2, ty, 14 + blink * 4, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
    text('Space / Click / Tap', W / 2, Math.round(groundY * 0.72) + 66, 11, { lw: 3 });
    if (best > 0) text('BEST ' + best, W / 2, groundY + 40, 16, { lw: 4 });
  }

  if (g.state === 'over') drawGameOver();

  drawMute();
  ctx.restore();

  if (g.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (g.flash * 0.85) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------------- Layout / resize ---------------- */
function layout(force) {
  const iw = window.innerWidth, ih = window.innerHeight;
  const locked = (game.state === 'play' || game.state === 'dying') && !force;
  if (!locked) {
    H = Math.max(512, Math.min(620, Math.round(W * ih / iw)));
    groundY = H - GROUND_H;
    if (game.state === 'ready') game.bird.y = hoverY();
    if (game.state === 'over') game.bird.y = groundY - HIT_H / 2;
    if (!game.clouds.length) initClouds();
  }
  scale = Math.min(iw / W, ih / H);
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cw = W * scale, ch = H * scale;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
}
window.addEventListener('resize', () => layout(false));
window.addEventListener('orientationchange', () => setTimeout(() => layout(false), 100));

/* ---------------- Input ---------------- */
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function inBtn(p) {
  const b = overLayout().btn;
  return p.x >= b.x - 6 && p.x <= b.x + b.w + 6 && p.y >= b.y - 6 && p.y <= b.y + b.h + 6;
}
function toggleMute() {
  muted = !muted; lsSet('flappy_muted', muted ? '1' : '0');
  if (!muted) { ensureAudio(); tone(660, 880, 0.08, 'triangle', 0.15); }
}
function action() {
  const g = game;
  if (g.state === 'ready' || g.state === 'play') flap();
  else if (g.state === 'over' && g.overT > 0.6) reset();
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  ensureAudio();
  const p = toLogical(e);
  if (Math.hypot(p.x - (W - 24), p.y - 24) < 24) { toggleMute(); return; }
  if (game.state === 'over') {
    if (UI.btnActive && inBtn(p)) { UI.btnDown = true; try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
    return;
  }
  flap();
});
function release(e) {
  if (UI.btnDown) {
    UI.btnDown = false;
    if (game.state === 'over' && inBtn(toLogical(e))) { ensureAudio(); reset(); }
  }
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', () => { UI.btnDown = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
['touchstart', 'touchmove', 'touchend'].forEach(n =>
  document.addEventListener(n, e => e.preventDefault(), { passive: false }));
document.addEventListener('gesturestart', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    ensureAudio();
    action();
  } else if (e.code === 'KeyM') {
    toggleMute();
  }
});

/* ---------------- Main loop ---------------- */
let last = 0, acc = 0;
function frame(ts) {
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0.1) dt = 0.1;           // tab switch / hitch guard
  acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}

layout(true);
initClouds();
reset();
canvas.focus();
requestAnimationFrame(frame);
</script>
</body>
</html>
